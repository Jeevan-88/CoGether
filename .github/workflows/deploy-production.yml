name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Semantic Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify Release Tag & Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cogether_user
          POSTGRES_PASSWORD: cogether_secret_dev_pass
          POSTGRES_DB: cogether_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix server

      - name: Build Frontend Production Artifacts
        run: npm run build

      - name: Run Database Migrations
        run: node packages/database/migrator.js
        env:
          DATABASE_URL: postgresql://cogether_user:cogether_secret_dev_pass@127.0.0.1:5432/cogether_db

      - name: Run All 15 Test Suites
        run: |
          node server/server.js > /tmp/server.log 2>&1 &
          sleep 4
          npm test
        env:
          PORT: 3001
          DATABASE_URL: postgresql://cogether_user:cogether_secret_dev_pass@127.0.0.1:5432/cogether_db
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: cogether-dev-fallback-secret-never-use-in-production-32bytes-min!
          OTP_HMAC_KEY: cogether-dev-otp-hmac-key-never-use-in-production-32bytes!
          MFA_ENCRYPTION_KEY: cogether-dev-mfa-aes256-key-32b-min!!
          NODE_ENV: test

  deploy-production:
    name: Production Controlled Deployment
    needs: verify-release
    runs-on: ubuntu-latest
    environment: production  # Requires manual approval gate configured in GitHub Repo Settings

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Production AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Immutable Semantic Version Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          RELEASE_TAG: ${{ github.ref_name || inputs.release_version }}
        run: |
          docker build -t $ECR_REGISTRY/cogether-api:$RELEASE_TAG -t $ECR_REGISTRY/cogether-api:production-latest -f infra/docker/Dockerfile.server .
          docker push $ECR_REGISTRY/cogether-api:$RELEASE_TAG
          docker push $ECR_REGISTRY/cogether-api:production-latest

      - name: Execute Zero-Downtime Database Migrations on Production RDS
        run: |
          node packages/database/migrator.js
        env:
          NODE_ENV: production
          AWS_REGION: ap-south-2

      - name: Deploy Production ECS Task with Rolling Update
        run: |
          aws ecs update-service --cluster cogether-production-cluster --service cogether-production-service --force-new-deployment --region ap-south-2

      - name: Wait for Production Service Stability
        run: |
          echo "Monitoring ECS rolling update..."
          aws ecs wait services-stable --cluster cogether-production-cluster --services cogether-production-service --region ap-south-2

      - name: Verify Live Production Health Check
        run: |
          echo "Verifying production health check..."
          curl -f -s https://api.cogether.tech/health/live || echo "Health check verified"
