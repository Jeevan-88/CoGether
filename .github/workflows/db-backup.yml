name: Automated Database Backups

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  workflow_dispatch:

jobs:
  backup:
    name: PostgreSQL Encrypted Backup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run database backup script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          BACKUP_STORAGE_BUCKET: ${{ secrets.BACKUP_STORAGE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-2' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret is not configured yet. Configure Settings -> Secrets -> DATABASE_URL to enable live RDS backups."
            exit 0
          fi
          node scripts/backup-database.js

      - name: Upload compressed backup artifact (when present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cogether-db-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 14
          if-no-files-found: ignore
