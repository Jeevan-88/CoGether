name: CoGether CI

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cogether_user
          POSTGRES_PASSWORD: cogether_secret_dev_pass
          POSTGRES_DB: cogether_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend and root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Build frontend
        run: npm run build

      - name: Run database migrations
        run: node packages/database/migrator.js
        env:
          DATABASE_URL: postgresql://cogether_user:cogether_secret_dev_pass@127.0.0.1:5432/cogether_db

      - name: Start backend server and run automated test suites
        run: |
          node server/server.js > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "Server started with PID $SERVER_PID"

          READY=0
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:3001/health/live | grep -q "ok"; then
              echo "Backend server is healthy and ready!"
              READY=1
              break
            fi
            echo "Waiting for backend server to become healthy (attempt $i/30)..."
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "Backend server failed to start within 30 seconds. Server log:"
            cat /tmp/server.log
            exit 1
          fi

          echo "Executing full test suite..."
          npm test
          TEST_EXIT=$?

          if [ $TEST_EXIT -ne 0 ]; then
            echo "Tests failed with exit code $TEST_EXIT. Server log:"
            cat /tmp/server.log
            exit $TEST_EXIT
          fi
        env:
          PORT: 3001
          DATABASE_URL: postgresql://cogether_user:cogether_secret_dev_pass@127.0.0.1:5432/cogether_db
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: cogether-dev-fallback-secret-never-use-in-production-32bytes-min!
          OTP_HMAC_KEY: cogether-dev-otp-hmac-key-never-use-in-production-32bytes!
          MFA_ENCRYPTION_KEY: cogether-dev-mfa-aes256-key-32b-min!!
          NODE_ENV: test
