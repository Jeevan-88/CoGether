<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375">
  <rect width="600" height="375" fill="#4ec0ca"/>
  <!-- Pixel Clouds -->
  <rect x="60" y="70" width="120" height="35" rx="10" fill="#ffffff" opacity="0.85"/>
  <rect x="420" y="50" width="140" height="40" rx="12" fill="#ffffff" opacity="0.85"/>
  <!-- Green Obstacle Pipes -->
  <!-- Top Pipe -->
  <rect x="360" y="0" width="80" height="130" fill="#73bf2e" stroke="#222222" stroke-width="3"/>
  <rect x="350" y="105" width="100" height="30" fill="#73bf2e" stroke="#222222" stroke-width="3"/>
  <!-- Bottom Pipe -->
  <rect x="360" y="240" width="80" height="90" fill="#73bf2e" stroke="#222222" stroke-width="3"/>
  <rect x="350" y="235" width="100" height="30" fill="#73bf2e" stroke="#222222" stroke-width="3"/>
  <!-- Animated Pixel Ground -->
  <rect x="0" y="325" width="600" height="50" fill="#ded895" stroke="#222222" stroke-width="3"/>
  <rect x="0" y="325" width="600" height="12" fill="#73bf2e"/>
  <!-- Clumsy Bird Character -->
  <g transform="translate(180, 155)">
    <!-- Body -->
    <ellipse cx="30" cy="25" rx="26" ry="20" fill="#f8e71c" stroke="#222222" stroke-width="3"/>
    <!-- Belly -->
    <ellipse cx="25" cy="30" rx="18" ry="12" fill="#ffffff"/>
    <!-- Wing -->
    <ellipse cx="14" cy="24" rx="12" ry="8" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <!-- Eye -->
    <circle cx="42" cy="18" r="9" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <circle cx="45" cy="18" r="4" fill="#000000"/>
    <!-- Beak -->
    <polygon points="46,24 62,30 46,36" fill="#f5a623" stroke="#222222" stroke-width="2"/>
  </g>
  <!-- Title & Badge -->
  <text x="300" y="362" font-family="'Impact', sans-serif" font-size="28" fill="#222222" letter-spacing="3" text-anchor="middle">CLUMSY BIRD</text>
</svg>
