<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375">
  <rect width="600" height="375" fill="#08080c"/>
  <!-- Subtle Grid Lines -->
  <g stroke="#1a1a24" stroke-width="1.5">
    <line x1="150" y1="0" x2="150" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="375"/>
    <line x1="250" y1="0" x2="250" y2="375"/>
    <line x1="300" y1="0" x2="300" y2="375"/>
    <line x1="350" y1="0" x2="350" y2="375"/>
    <line x1="400" y1="0" x2="400" y2="375"/>
    <line x1="450" y1="0" x2="450" y2="375"/>
    <line x1="0" y1="50" x2="600" y2="50"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
  </g>
  <!-- Tetromino Pieces -->
  <!-- Cyan I-piece -->
  <g fill="#00f0f0" stroke="#000000" stroke-width="2">
    <rect x="150" y="250" width="48" height="48" rx="4"/>
    <rect x="200" y="250" width="48" height="48" rx="4"/>
    <rect x="250" y="250" width="48" height="48" rx="4"/>
    <rect x="300" y="250" width="48" height="48" rx="4"/>
  </g>
  <!-- Yellow O-piece -->
  <g fill="#FFE500" stroke="#000000" stroke-width="2">
    <rect x="350" y="200" width="48" height="48" rx="4"/>
    <rect x="400" y="200" width="48" height="48" rx="4"/>
    <rect x="350" y="250" width="48" height="48" rx="4"/>
    <rect x="400" y="250" width="48" height="48" rx="4"/>
  </g>
  <!-- Purple T-piece (falling) -->
  <g fill="#a000f0" stroke="#000000" stroke-width="2">
    <rect x="250" y="80" width="48" height="48" rx="4"/>
    <rect x="200" y="130" width="48" height="48" rx="4"/>
    <rect x="250" y="130" width="48" height="48" rx="4"/>
    <rect x="300" y="130" width="48" height="48" rx="4"/>
  </g>
  <!-- Orange L-piece -->
  <g fill="#f0a000" stroke="#000000" stroke-width="2">
    <rect x="150" y="150" width="48" height="48" rx="4"/>
    <rect x="150" y="200" width="48" height="48" rx="4"/>
    <rect x="200" y="200" width="48" height="48" rx="4"/>
    <rect x="250" y="200" width="48" height="48" rx="4"/>
  </g>
  <!-- Title & Badge -->
  <text x="300" y="348" font-family="'Impact', sans-serif" font-size="28" fill="#ffffff" letter-spacing="3" text-anchor="middle">BLOCK PUZZLE</text>
</svg>
