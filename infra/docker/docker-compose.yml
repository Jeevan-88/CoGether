services:
  # ── PostgreSQL 16 Database ──────────────────────────────────────────────────
  cogether-db:
    image: postgres:16-alpine
    container_name: cogether_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cogether_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cogether_db}
    ports:
      # Bound strictly to 127.0.0.1 to avoid public exposure
      - "127.0.0.1:5434:5432"
    volumes:
      - cogether_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cogether_user} -d ${POSTGRES_DB:-cogether_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cogether-network

  # ── Redis 7 Ephemeral State & Pub/Sub ───────────────────────────────────────
  cogether-redis:
    image: redis:7-alpine
    container_name: cogether_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # Bound strictly to 127.0.0.1 to avoid public exposure
      - "127.0.0.1:6380:6379"
    volumes:
      - cogether_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cogether-network

  # ── CoGether Stateless Node.js API & Signaling Server ───────────────────────
  cogether-server:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.server
    container_name: cogether_api_server
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3001}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be provided in .env}
      REDIS_URL: ${REDIS_URL:-redis://cogether-redis:6379}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      # Bound strictly to 127.0.0.1 to avoid public exposure
      - "127.0.0.1:3001:3001"
    depends_on:
      cogether-db:
        condition: service_healthy
      cogether-redis:
        condition: service_healthy
    networks:
      - cogether-network

volumes:
  cogether_pgdata:
    driver: local
  cogether_redisdata:
    driver: local

networks:
  cogether-network:
    driver: bridge
